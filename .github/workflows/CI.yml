name: CI
env:
    DEBUG: napi:*
    APP_NAME: serialport-napi-rs
    MACOSX_DEPLOYMENT_TARGET: "10.13"
    CARGO_INCREMENTAL: "1"
    CARGO_TERM_COLOR: always

on:
    push:
        branches:
            - main
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"
    pull_request: null

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "yarn"

            - name: Setup Rust
              shell: bash
              run: |
                  rustup component add rustfmt
                  rustup component add clippy

            - name: Install dependencies
              run: yarn install

            - name: Lint
              run: yarn lint

            - name: Format
              run: yarn format:ci
    build:
        strategy:
            fail-fast: false
            matrix:
                settings:
                    - host: macos-26
                      target: x86_64-apple-darwin
                      build: yarn build --target x86_64-apple-darwin
                    - host: windows-2025
                      target: x86_64-pc-windows-msvc
                      build: yarn build --target x86_64-pc-windows-msvc
                    - host: ubuntu-26.04
                      target: x86_64-unknown-linux-gnu
                      build: yarn build --target x86_64-unknown-linux-gnu --use-napi-cross
                    - host: ubuntu-26.04
                      target: x86_64-unknown-linux-musl
                      build: yarn build --target x86_64-unknown-linux-musl -x
                    - host: macos-26
                      target: aarch64-apple-darwin
                      build: yarn build --target aarch64-apple-darwin
                    - host: ubuntu-26.04
                      target: aarch64-unknown-linux-gnu
                      build: yarn build --target aarch64-unknown-linux-gnu --use-napi-cross
                    - host: ubuntu-26.04
                      target: aarch64-linux-android
                      build: yarn build --target aarch64-linux-android
                    - host: ubuntu-26.04
                      target: aarch64-unknown-linux-musl
                      build: yarn build --target aarch64-unknown-linux-musl -x
                    - host: windows-2025
                      target: aarch64-pc-windows-msvc
                      build: yarn build --target aarch64-pc-windows-msvc
        name: stable - ${{ matrix.settings.target }} - node@24
        runs-on: ${{ matrix.settings.host }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: yarn

            - name: Setup Rust
              shell: bash
              run: |
                  rustup target add ${{ matrix.settings.target }}
                  rustup toolchain list
                  rustup target list | grep installed
                  rustc --version --verbose

            - name: Setup Zig if required by build
              if: ${{ contains(matrix.settings.build, ' -x') }}
              run: |
                  sudo apt-get install -y zig0.15

            - name: Install dependencies
              run: yarn install

            - name: Build
              shell: bash
              run: ${{ matrix.settings.build }}
              env:
                  CARGO_ZIGBUILD_ZIG_PATH: zig0.15

            - name: Upload artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: bindings-${{ matrix.settings.target }}
                  path: |
                      ${{ env.APP_NAME }}.*.node
                  if-no-files-found: error
    test-macOS-windows-binding:
        name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
        needs:
            - build
        strategy:
            fail-fast: false
            matrix:
                settings:
                    - host: windows-2025
                      target: x86_64-pc-windows-msvc
                      architecture: x64
                    - host: windows-11-arm
                      target: aarch64-pc-windows-msvc
                      architecture: arm64
                    - host: macos-26
                      target: aarch64-apple-darwin
                      architecture: arm64
                    - host: macos-26
                      target: x86_64-apple-darwin
                      architecture: x64
                node:
                    - "24"
                    - "26"
        runs-on: ${{ matrix.settings.host }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ matrix.node }}
                  cache: yarn
                  architecture: ${{ matrix.settings.architecture }}

            - name: Install dependencies
              run: yarn install

            - name: Download artifacts
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: bindings-${{ matrix.settings.target }}
                  path: .

            - name: List packages
              run: ls -R .
              shell: bash

            - name: Test bindings
              run: yarn test
    test-linux-binding:
        name: Test ${{ matrix.target }} - node@${{ matrix.node }}
        needs:
            - build
        strategy:
            fail-fast: false
            matrix:
                target:
                    - x86_64-unknown-linux-gnu
                    - x86_64-unknown-linux-musl
                    - aarch64-unknown-linux-gnu
                    - aarch64-unknown-linux-musl
                node:
                    - "24"
                    - "26"
        runs-on: ${{ contains(matrix.target, 'aarch64') && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ matrix.node }}
                  cache: yarn

            - name: Output docker params
              id: docker
              run: |
                  node -e "
                    if ('${{ matrix.target }}'.startsWith('aarch64')) {
                      console.log('PLATFORM=linux/arm64')
                    } else {
                      console.log('PLATFORM=linux/amd64')
                    }
                  " >> $GITHUB_OUTPUT
                  node -e "
                    if ('${{ matrix.target }}'.endsWith('-musl')) {
                      console.log('IMAGE=node:${{ matrix.node }}-alpine')
                    } else {
                      console.log('IMAGE=node:${{ matrix.node }}-slim')
                    }
                  " >> $GITHUB_OUTPUT

            - name: Install dependencies
              run: |
                  yarn config set --json supportedArchitectures.cpu '["current", "arm64", "x64", "arm"]'
                  yarn config set --json supportedArchitectures.libc '["current", "musl", "gnu"]'
                  yarn install

            - name: Download artifacts
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: bindings-${{ matrix.target }}
                  path: .

            - name: List packages
              run: ls -R .
              shell: bash

            - name: Test bindings
              uses: tj-actions/docker-run@1d25a677da8f1243a138dc5db21e307e92986ffe # v2.2.1
              with:
                  image: ${{ steps.docker.outputs.IMAGE }}
                  name: test-bindings-${{ matrix.target }}
                  options: -v ${{ github.workspace }}:${{ github.workspace }} -w ${{ github.workspace }} --platform ${{ steps.docker.outputs.PLATFORM }}
                  args: npm run test
    publish:
        name: Publish
        runs-on: ubuntu-26.04
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
        permissions:
            contents: write
            id-token: write
        needs:
            - lint
            - test-macOS-windows-binding
            - test-linux-binding
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: yarn

            - name: Install dependencies
              run: yarn install

            - name: create npm dirs
              run: yarn napi create-npm-dirs

            - name: Download all artifacts
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: artifacts

            - name: Move artifacts
              run: yarn artifacts

            - name: List packages
              run: ls -R ./npm
              shell: bash

            - name: publish on npm with OIDC
              run: |
                  npm publish --provenance --access public
