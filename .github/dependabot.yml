version: 2
updates:
    - package-ecosystem: npm
      versioning-strategy: increase
      directory: /
      schedule:
          interval: monthly
      target-branch: main
      commit-message:
          prefix: fix(deps)
      groups:
          minor-patch:
              applies-to: version-updates
              update-types:
                  - minor
                  - patch

    - package-ecosystem: cargo
      versioning-strategy: increase
      directory: /
      schedule:
          interval: monthly
      target-branch: main
      commit-message:
          prefix: fix(deps)
      groups:
          minor-patch:
              applies-to: version-updates
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      target-branch: main
      commit-message:
          prefix: chore
